[project]
name = "titan-ai"
version = "0.1.0"
description = "TITAN AI — MT5 + Grok AI + Telegram trading bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "UsmonovSardor" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
